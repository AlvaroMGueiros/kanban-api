spring:
  application:
    name: kanban-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kanban}
    username: ${DATABASE_USERNAME:kanban}
    password: ${DATABASE_PASSWORD:kanbanLocal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: kanban
        globally_quoted_identifiers: true
  flyway:
    default-schema: public
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
